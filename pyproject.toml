[project]
name = "kosmos"
version = "0.1.0"
description = "A local-first, modular personal AI assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
keywords = ["assistant", "local-first", "artificial-intelligence"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kosmos"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tools/motion-lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13.10,<0.14"
package = true
